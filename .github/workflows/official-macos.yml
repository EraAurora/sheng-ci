name: official macOS package

# The project's own entry point: scripts/package.sh (unixnu release) on a macOS runner, with UniXNU
# at the commit .github/workflows/package.yml pins. This exists to compare a build made strictly by
# the official orchestration with the one .github/workflows/sheng-kernel.yml makes step by step.
on:
  workflow_dispatch:
    inputs:
      os:
        description: OS profile (shorthand or profile name)
        required: true
        default: macos-27.3-26C5035r
      unixnu_ref:
        description: UniXNU commit to build with
        required: true
        default: main
      chip_id:
        description: Platform seed (/chosen/unique-chip-id, 8 bytes hex)
        required: true
        default: "b714917c"
      cache_version:
        description: Bump to discard every cache below
        required: true
        default: "1"

permissions:
  contents: read

env:
  CACHE_VERSION: ${{ inputs.cache_version }}
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      OS_PROFILE: ${{ inputs.os }}
      UNIXNU_UNIQUE_CHIP_ID: ${{ inputs.chip_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: device
          submodules: recursive
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.unixnu_ref }}
          path: UniXNU
          submodules: recursive
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache Homebrew formulae
        uses: actions/cache@v4
        with:
          path: |
            /opt/homebrew/Cellar
            /opt/homebrew/opt
            /opt/homebrew/Caskroom
            ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ env.CACHE_VERSION }}
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Cache the Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.cargo/registry
          key: rust-${{ runner.os }}-1.98.0-${{ env.CACHE_VERSION }}
          restore-keys: |
            rust-${{ runner.os }}-1.98.0-

      - name: tools
        run: |
          for formula in dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup unifdef; do
            brew list --versions "$formula" >/dev/null 2>&1 || brew install "$formula"
          done
          brew list --versions ipsw >/dev/null 2>&1 || brew install blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "$(brew --prefix llvm)/bin"
            echo "$(brew --prefix lld)/bin"
            echo "$(brew --prefix bison)/bin"
          } >> "$GITHUB_PATH"
          if ! rustup toolchain list | grep -q '^1\.98\.0'; then
            rustup toolchain install 1.98.0 --profile minimal
          fi
          rustup component list --toolchain 1.98.0 --installed | grep -q rust-src || \
            rustup component add rust-src --toolchain 1.98.0

      - name: Cache the fetched sources
        uses: actions/cache@v4
        with:
          path: UniXNU/out/feeds
          key: feeds-${{ runner.os }}-${{ hashFiles('device/unixnu.lock') }}-${{ env.CACHE_VERSION }}
          restore-keys: |
            feeds-${{ runner.os }}-

      - name: Cache the IPSW members
        uses: actions/cache@v4
        with:
          path: UniXNU/out/ipsw
          key: ipsw-${{ runner.os }}-${{ inputs.os }}-${{ env.CACHE_VERSION }}
          restore-keys: |
            ipsw-${{ runner.os }}-${{ inputs.os }}-

      - name: Cache the ath12k sources
        uses: actions/cache@v4
        with:
          path: device/drivers/Ath12kWifi/deps
          key: ath12k-${{ runner.os }}-${{ hashFiles('device/drivers/Ath12kWifi/tools/source-lock.json') }}-${{ env.CACHE_VERSION }}
          restore-keys: |
            ath12k-${{ runner.os }}-

      - name: Cache Turnip and the Metal bridge
        uses: actions/cache@v4
        with:
          path: |
            UniXNU/out/sheng/${{ inputs.os }}/sheng_macos/tree/.cache/mesa-work
            UniXNU/out/sheng/${{ inputs.os }}/sheng_macos/tree/.cache/mesa-venv
            UniXNU/out/sheng/${{ inputs.os }}/sheng_macos/tree/.cache/gpu-reference
            UniXNU/out/sheng/${{ inputs.os }}/sheng_macos/tree/build/mesa-tu-macos27
            UniXNU/out/sheng/${{ inputs.os }}/sheng_macos/tree/build/adreno-metal-bridge
          key: mesa-${{ runner.os }}-${{ hashFiles('UniXNU/scripts/data/adreno-compiler-inputs.json') }}-${{ env.CACHE_VERSION }}
          restore-keys: |
            mesa-${{ runner.os }}-

      - name: vendor files and WiFi sources
        working-directory: device
        run: |
          python3 scripts/extract-files.py
          python3 drivers/Ath12kWifi/tools/fetch-sources.py

      - name: place the Data seed where the release expects it
        run: |
          work=UniXNU/out/sheng/macos-27.3-26C5035r/sheng_macos/runtime
          mkdir -p "$work"
          cp device/seed/data.dbr "$work/data.dbr"
          ls -l "$work"

      - name: package (unixnu release)
        working-directory: device
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/package.sh --os "$OS_PROFILE" --uefi ../uefi-sheng

      - name: collect
        if: always()
        run: |
          mkdir -p artifacts
          cp -v UniXNU/out/sheng/*/*/boot/boot.img artifacts/ 2>/dev/null || true
          cp -v UniXNU/out/sheng/*/*/payload/payload.img artifacts/ 2>/dev/null || true
          cp -v UniXNU/out/sheng/*/*/kernel/kernel.macho artifacts/ 2>/dev/null || true
          cp -v UniXNU/out/sheng/*/*/package.manifest.json artifacts/ 2>/dev/null || true
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-images
          path: artifacts/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-logs
          path: UniXNU/out/sheng/*/*/logs/*.log
          if-no-files-found: ignore
